name: Build and Push Runner Image

on:
  # The image is a function of both the upstream runner release and this
  # repo's Dockerfile, so changes to either must produce a new image.
  # Without this, a Dockerfile-only change (new tooling, no upstream bump)
  # was never built: the scheduled run resolved the same runner version,
  # found that tag already published, and skipped.
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.android
      - toolcache/**
      - .github/workflows/build.yml
  schedule:
    # Check for new upstream releases daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      runner_version:
        description: "Runner version to build (e.g. 2.334.0). Leave empty to auto-detect latest."
        required: false
      force:
        description: "Rebuild even if the version tag already exists."
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      go_stable: ${{ steps.resolve.outputs.go_stable }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ inputs.runner_version }}" ]]; then
            VERSION="${{ inputs.runner_version }}"
          else
            VERSION=$(gh api repos/falcondev-oss/github-actions-runner/releases/latest --jq '.tag_name' | sed 's/^v//')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Latest Go release, baked into the image via the manifest's `stable`
          # entry. Passed as a build arg so a new release invalidates the cached
          # toolcache stage.
          GO_STABLE=$(curl -fsSL 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')
          echo "go_stable=${GO_STABLE}" >> "$GITHUB_OUTPUT"

          # Decide whether to build.
          #
          # The version tag alone does not identify the image: the Dockerfile
          # contributes tooling on top of the upstream runner. So a push that
          # edits the Dockerfile, or an explicit force, must rebuild even when
          # the version tag already exists. Only the scheduled upstream-watch
          # case is allowed to skip.
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.force }}" == "true" ]]; then
            echo "Build forced by ${{ github.event_name }}; rebuilding ${VERSION}."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ghcr needs a bearer token from its token endpoint, not the raw
          # GITHUB_TOKEN. The previous version sent base64(GITHUB_TOKEN) as the
          # bearer, which ghcr rejected, so this always returned 404 and the
          # skip never fired: every scheduled run rebuilt and repushed an image
          # that already existed.
          REGISTRY_TOKEN=$(curl -s -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:pull&service=ghcr.io" \
            | jq -r '.token')

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/manifests/${VERSION}")

          if [[ "$STATUS" == "200" ]]; then
            echo "Tag ${VERSION} already exists, skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${VERSION} not found (HTTP ${STATUS}), will build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            RUNNER_VERSION=${{ needs.check.outputs.version }}
            GO_STABLE=${{ needs.check.outputs.go_stable }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          # Registry cache on ghcr. The GitHub Actions cache could not hold
          # mode=max exports ("Could not authorize multipart upload"), and
          # mode=max is needed so the toolcache builder stage is reused.
          # ignore-error keeps a cache failure from failing a good build.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

  # Android runner image, published alongside the general one.
  #
  # Separate because the Android SDK is several gigabytes, most of it the NDK,
  # and only one scale set needs it. A single image would make every job on
  # every pool pull the SDK, including lint jobs that never touch Android.
  #
  # Built on amd64 only. The SDK's build-tools and NDK host binaries are x86_64,
  # so an arm64 image would carry an SDK it cannot execute.
  build-android:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    # Larger than the general image's runner: this one unpacks several
    # gigabytes of SDK and NDK, which is disk- and CPU-bound rather than
    # network-bound.
    runs-on: ubicloud-standard-8
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.android
          push: true
          build-args: |
            RUNNER_VERSION=${{ needs.check.outputs.version }}
            GO_STABLE=${{ needs.check.outputs.go_stable }}
          tags: |
            ${{ env.IMAGE_NAME }}-android:${{ needs.check.outputs.version }}
            ${{ env.IMAGE_NAME }}-android:latest
          platforms: linux/amd64
          # Same registry cache as the general image, under the Android
          # package. mode=max keeps the SDK and toolcache stages reusable.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}-android:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}-android:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
